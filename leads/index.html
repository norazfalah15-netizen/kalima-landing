<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>المسجلين — كلمة</title>
<style>
:root{--paper:#FAF6EC;--card:#FFFDF7;--ink:#23332F;--soft:#7A6A55;--moss:#2F4A38;--gold:#C79A3C;--line:#EAE0CC}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,'Noto Kufi Arabic',sans-serif;background:var(--paper);color:var(--ink);padding:16px;line-height:1.7;padding-bottom:40px}
.box{max-width:600px;margin:0 auto}
h1{font-size:21px;margin:6px 0 14px}
input,button{font:inherit;border-radius:12px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--gold)}
.ltr{direction:ltr;text-align:left}
.btn{border:0;background:var(--moss);color:#fff;font-weight:700;padding:12px 14px;cursor:pointer;width:100%}
.btn.alt{background:#fff;color:var(--moss);border:1.5px solid var(--moss)}
.err{color:#B3392B;min-height:22px;font-size:14px;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:24px;line-height:1.2}
.st span{font-size:12.5px;color:var(--soft)}
.bar{display:flex;gap:8px;margin:10px 0}
.bar .btn{width:auto;flex:1;font-size:14px;padding:10px 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.row .em{direction:ltr;text-align:left;font-weight:700;font-size:15px;word-break:break-all}
.row .ph{direction:ltr;text-align:left;font-size:15px;margin-top:2px}
.row .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--soft)}
.new{background:var(--gold);color:#fff;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:700}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{flex:1;min-width:76px;text-align:center;text-decoration:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 6px;font-size:13.5px;font-weight:600;cursor:pointer;border-radius:10px}
.acts a.wa{background:#25D366;border-color:#25D366;color:#fff}
.empty{text-align:center;color:var(--soft);padding:24px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="box">
  <div id="login">
    <h1>المسجلين</h1>
    <input type="password" id="pw" class="ltr" placeholder="كلمة السر" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" id="go">دخول</button>
  </div>
  <div id="list" hidden>
    <h1>المسجلين</h1>
    <div class="stats">
      <div class="st"><b id="sAll">0</b><span>الكل</span></div>
      <div class="st"><b id="sToday">0</b><span>اليوم</span></div>
      <div class="st"><b id="sWeek">0</b><span>آخر ٧ أيام</span></div>
    </div>
    <input id="q" placeholder="ابحثي بالإيميل أو الرقم">
    <div class="bar">
      <button class="btn alt" id="cpE">نسخ كل الإيميلات</button>
      <button class="btn alt" id="cpP">نسخ كل الأرقام</button>
      <button class="btn" id="csv">تنزيل ملف</button>
    </div>
    <div id="rows"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var U='https://llzehodvkaddizklaywy.supabase.co/rest/v1/rpc/get_trial_leads',
    KEY='sb_publishable_8mtwca4dj1U99oE40ufSeg_b57gyO4D', data=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1400)}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('تم النسخ')},fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){}a.remove()}
}
function wa(p){var d=p.replace(/\D/g,''); if(d.length===8) d='965'+d; return 'https://wa.me/'+d}
function ago(t){
  var m=Math.floor((Date.now()-new Date(t))/60000);
  if(m<1) return 'الحين'; if(m<60) return 'قبل '+m+' دقيقة';
  var h=Math.floor(m/60); if(h<24) return 'قبل '+h+' ساعة';
  var d=Math.floor(h/24); return d===1?'أمس':'قبل '+d+' يوم';
}
function render(){
  var q=$('q').value.trim().toLowerCase(), h='', n=0;
  data.forEach(function(x,i){
    if(q && x.email.toLowerCase().indexOf(q)<0 && x.phone.indexOf(q)<0) return;
    n++;
    var isNew=(Date.now()-new Date(x.created_at))<86400000;
    h+='<div class="row"><div class="em">'+esc(x.email)+'</div><div class="ph">'+esc(x.phone)+'</div>'+
       '<div class="meta"><span>'+ago(x.created_at)+'</span>'+(isNew?'<span class="new">جديد</span>':'')+'</div>'+
       '<div class="acts"><a class="wa" target="_blank" rel="noopener" href="'+wa(x.phone)+'">واتساب</a>'+
       '<a href="mailto:'+esc(x.email)+'">إيميل</a>'+
       '<button data-c="'+esc(x.email)+'">نسخ الإيميل</button><button data-c="'+esc(x.phone)+'">نسخ الرقم</button></div></div>';
  });
  $('rows').innerHTML=h||'<div class="empty">'+(data.length?'ما فيه نتائج':'ما أحد سجّل للحين')+'</div>';
}
function show(d,pw){
  data=d; $('login').hidden=true; $('list').hidden=false;
  var now=Date.now(), day=new Date(); day.setHours(0,0,0,0);
  $('sAll').textContent=d.length;
  $('sToday').textContent=d.filter(function(x){return new Date(x.created_at)>=day}).length;
  $('sWeek').textContent=d.filter(function(x){return now-new Date(x.created_at)<7*86400000}).length;
  render();
  try{sessionStorage.setItem('lp',pw)}catch(e){}
}
function enter(pw){
  fetch(U,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({pw:pw})})
   .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){show(d,pw)})
   .catch(function(){$('err').textContent='كلمة السر غلط'; try{sessionStorage.removeItem('lp')}catch(e){}});
}
$('go').onclick=function(){enter($('pw').value)};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')enter(this.value)});
$('q').addEventListener('input',render);
$('rows').addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-c'); if(c) copy(c)});
$('cpE').onclick=function(){copy(data.map(function(x){return x.email}).join('\n'))};
$('cpP').onclick=function(){copy(data.map(function(x){return x.phone}).join('\n'))};
$('csv').onclick=function(){
  var c='﻿email,phone,date\n'+data.map(function(x){return [x.email,'"'+x.phone+'"',x.created_at].join(',')}).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'})); a.download='kalima-leads.csv'; a.click();
};
setInterval(function(){if(!$('list').hidden)render()},60000);
try{var s=sessionStorage.getItem('lp'); if(s) enter(s);}catch(e){}
</script>
</body>
</html>
